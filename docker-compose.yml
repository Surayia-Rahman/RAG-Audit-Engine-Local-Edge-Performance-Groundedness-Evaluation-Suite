version: '3.8'

services:
  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres_container
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=research_user
      - POSTGRES_PASSWORD=research_password_2026
      - POSTGRES_DB=rag_experiments
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: